# Dataset and model-weight registry.
#
# Every entry records where the data comes from and the terms it is released under.
# `verified: false` means the licence text below is the project's best understanding and a human
# has NOT yet re-read the source page. `clinictune licences --strict` exits non-zero while any
# dataset used in a run is unverified - flip it to true (and add `verified_on` / `verified_by`)
# only after reading the licence at the URL yourself. Terms change; re-check before publishing.
#
# Nothing listed here is redistributed by this repository. Data and weights are never committed.

datasets:
  tbx11k:
    task: tb
    title: "TBX11K (Liu et al., CVPR 2020)"
    url: "https://mmcheng.net/tb/"
    licence: "Research use; see dataset page. Test-split labels are withheld for the online benchmark."
    commercial_use: "unclear - verify"
    access: "Public download after accepting terms on the project page / Kaggle mirror."
    patient_ids: false
    notes: >
      No patient identifiers are released, so each image is treated as its own patient (a known
      limitation: duplicate patients across splits cannot be ruled out). The official test labels are
      hidden, so ClinicTune evaluates on the official *val* split and says so in every table.
    citation: "Liu Y, Wu Y-H, Ban Y, Wang H, Cheng M-M. Rethinking computer-aided tuberculosis diagnosis. CVPR 2020."
    verified: false

  shenzhen:
    task: tb
    title: "Shenzhen Hospital CXR set (NLM)"
    url: "https://lhncbc.nlm.nih.gov/LHC-downloads/downloads.html#tuberculosis-image-data-sets"
    licence: "Released by the U.S. National Library of Medicine for research; cite Jaeger et al. 2014."
    commercial_use: "unclear - verify"
    access: "Public download."
    patient_ids: true
    notes: "One image per patient (CHNCXR_####_L.png, L=0 normal / 1 TB). Lung masks available from community releases."
    citation: "Jaeger S, et al. Two public chest X-ray datasets for computer-aided screening of pulmonary diseases. Quant Imaging Med Surg 2014;4(6):475-7."
    verified: false

  montgomery:
    task: tb
    title: "Montgomery County CXR set (NLM)"
    url: "https://lhncbc.nlm.nih.gov/LHC-downloads/downloads.html#tuberculosis-image-data-sets"
    licence: "Released by the U.S. National Library of Medicine for research; cite Jaeger et al. 2014."
    commercial_use: "unclear - verify"
    access: "Public download."
    patient_ids: true
    notes: "138 images (MCUCXR_####_L.png). Manual lung masks included - used for the lung-masking shortcut test."
    citation: "Jaeger S, et al. Quant Imaging Med Surg 2014;4(6):475-7."
    verified: false

  mendeley_tb:
    task: tb
    title: "Mendeley Data TB chest X-ray set"
    url: "https://data.mendeley.com/  (record the exact DOI of the version you download)"
    licence: "Mendeley Data sets are usually CC BY 4.0 - confirm on the record page."
    commercial_use: "depends on record - verify"
    access: "Public download."
    patient_ids: false
    notes: "Folder-per-class layout. Record the DOI in `source_doi` below once chosen."
    source_doi: null
    citation: "Cite the record's DOI."
    verified: false

  aptos2019:
    task: dr
    title: "APTOS 2019 Blindness Detection (Kaggle)"
    url: "https://www.kaggle.com/competitions/aptos2019-blindness-detection/data"
    licence: "Kaggle competition rules - data use is restricted (non-commercial / competition terms)."
    commercial_use: "no (per competition rules) - verify"
    access: "Kaggle account and acceptance of competition rules."
    patient_ids: false
    notes: >
      Grades 0-4; ClinicTune uses referable DR = grade >= 2 (moderate NPDR or worse). Only train.csv has
      labels, so all splits are carved from it. Near-duplicate images are known to exist.
    citation: "APTOS 2019 Blindness Detection, Asia Pacific Tele-Ophthalmology Society, Kaggle 2019."
    verified: false

  idrid:
    task: dr
    title: "IDRiD - Indian Diabetic Retinopathy Image Dataset (disease grading)"
    url: "https://ieee-dataport.org/open-access/indian-diabetic-retinopathy-image-dataset-idrid"
    licence: "CC BY 4.0 (IEEE DataPort open access)."
    commercial_use: "yes with attribution (CC BY 4.0) - verify"
    access: "Public download (IEEE account)."
    patient_ids: false
    notes: "516 images from an Indian eye clinic; official train/test split is used as-is."
    citation: "Porwal P, et al. Indian Diabetic Retinopathy Image Dataset (IDRiD). IEEE Dataport 2018."
    verified: false

  messidor2:
    task: dr
    title: "Messidor-2"
    url: "https://www.adcis.net/en/third-party/messidor2/"
    licence: "Licence agreement required; research use only."
    commercial_use: "no - verify"
    access: "Request via ADCIS licence form. Grades from Krause et al. (Kaggle) or Abramoff et al."
    patient_ids: true
    notes: "Optional second DR set: images come in left/right eye pairs per exam - split by exam id."
    citation: "Decencière E, et al. Feedback on a publicly distributed database: the Messidor database. Image Anal Stereol 2014."
    verified: false

backbones:
  medsiglip-448:
    hf_id: "google/medsiglip-448"
    licence: "Health AI Developer Foundations (HAI-DEF) Terms of Use; gated on Hugging Face."
    url: "https://huggingface.co/google/medsiglip-448"
    notes: "Accept the terms on Hugging Face and authenticate before export. Weights are never committed."
    verified: false
  dinov2-small:
    hf_id: "facebook/dinov2-small"
    licence: "Apache-2.0"
    url: "https://huggingface.co/facebook/dinov2-small"
    notes: "Light CPU fallback (~22M params)."
    verified: false
  demo-randproj:
    hf_id: null
    licence: "Generated locally (Apache-2.0, part of this repo)."
    url: null
    notes: "Random-projection patch encoder used ONLY for the synthetic demo and tests. Not clinically meaningful."
    verified: true
