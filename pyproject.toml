[project]
name = "clinictune"
version = "0.1.0"
description = "Site-adaptive screening aid for chest X-ray TB and fundus diabetic retinopathy. Decision support only - not a diagnostic device."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# One-off: export a real foundation backbone (MedSigLIP / DINOv2) to ONNX. Not needed at serve time.
export = ["torch>=2.4", "transformers>=4.45", "onnxscript>=0.1"]
dicom = ["pydicom>=2.4"]
# Reproducible download of the public datasets (clinictune fetch ...).
fetch = ["huggingface_hub>=0.24", "pyarrow>=16"]

[project.scripts]
clinictune = "clinictune.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinictune"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "clinictune/_web"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/clinictune/site/report_card.py" = ["E501"]
"src/clinictune/i18n.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
