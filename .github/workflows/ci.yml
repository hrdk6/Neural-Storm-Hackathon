name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest --cov=clinictune --cov-report=term-missing
      - name: no data or weights committed
        run: |
          if git ls-files | grep -Ei '\.(onnx|npz|npy|dcm|sqlite3)$|^data/|^models/'; then
            echo "data or model files are tracked"; exit 1; fi
      - name: no AI co-author trailers
        run: |
          if git log --format=%B | grep -i 'co-authored-by'; then exit 1; fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinictune:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
